{% extends "admin/base.html" %}
{% block page_title %}New Appointment{% endblock %}
{% block content %}
<div class="admin-card" style="max-width:620px;">
  <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="grid grid-2">
      <div class="form-group"><label>Full Name *</label><input type="text" name="full_name" required></div>
      <div class="form-group"><label>Phone *</label><input type="tel" name="phone" required></div>
      <div class="form-group"><label>Email</label><input type="email" name="email"></div>
      <div class="form-group">
        <label>Treatment *</label>
        <select name="treatment_id" required>
          {% for t in treatments %}<option value="{{ t.id }}">{{ t.name }} ({{ t.duration_minutes }} min)</option>{% endfor %}
        </select>
      </div>
      <div class="form-group"><label>Date *</label><input type="date" name="date" required></div>
      <div class="form-group"><label>Time *</label><input type="time" name="time" required></div>
    </div>
    <div class="form-group"><label>Additional Notes</label><textarea name="additional_notes" rows="3"></textarea></div>
    <button type="submit" class="btn btn-primary">Create Appointment</button>
  </form>
</div>
{% endblock %}
