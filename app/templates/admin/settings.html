{% extends "admin/base.html" %}
{% block page_title %}Clinic Settings{% endblock %}
{% block content %}
<div class="admin-card" style="max-width:820px;">
  <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h3>Clinic Identity</h3>
    <div class="grid grid-2">
      <div class="form-group"><label>Clinic Name</label><input type="text" name="clinic_name" value="{{ settings.clinic_name }}"></div>
      <div class="form-group"><label>Tagline</label><input type="text" name="tagline" value="{{ settings.tagline }}"></div>
    </div>

    <h3>Doctor Profile</h3>
    <div class="grid grid-2">
      <div class="form-group"><label>Doctor Name</label><input type="text" name="doctor_name" value="{{ settings.doctor_name }}"></div>
      <div class="form-group"><label>Designation</label><input type="text" name="doctor_designation" value="{{ settings.doctor_designation }}"></div>
      <div class="form-group"><label>Qualifications</label><input type="text" name="doctor_qualifications" value="{{ settings.doctor_qualifications }}"></div>
      <div class="form-group"><label>Years of Experience</label><input type="number" name="doctor_experience_years" value="{{ settings.doctor_experience_years }}"></div>
      <div class="form-group"><label>Specializations</label><input type="text" name="doctor_specializations" value="{{ settings.doctor_specializations }}"></div>
      <div class="form-group"><label>Languages</label><input type="text" name="doctor_languages" value="{{ settings.doctor_languages }}"></div>
    </div>
    <div class="form-group"><label>Doctor Biography</label><textarea name="doctor_bio" rows="4">{{ settings.doctor_bio }}</textarea></div>

    <h3>Contact Information</h3>
    <div class="grid grid-2">
      <div class="form-group"><label>Phone</label><input type="text" name="phone" value="{{ settings.phone }}"></div>
      <div class="form-group"><label>WhatsApp Number (digits only)</label><input type="text" name="whatsapp" value="{{ settings.whatsapp }}"></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ settings.email }}"></div>
      <div class="form-group"><label>Appointment Duration (minutes)</label><input type="number" name="default_appointment_duration" value="{{ settings.default_appointment_duration }}"></div>
    </div>
    <div class="form-group"><label>Address</label><input type="text" name="address" value="{{ settings.address }}"></div>
    <div class="form-group"><label>Google Maps Embed URL</label><input type="text" name="google_maps_url" value="{{ settings.google_maps_url or '' }}"></div>

    <h3>Social Media</h3>
    <div class="grid grid-2">
      <div class="form-group"><label>Facebook URL</label><input type="text" name="facebook_url" value="{{ settings.facebook_url or '' }}"></div>
      <div class="form-group"><label>Instagram URL</label><input type="text" name="instagram_url" value="{{ settings.instagram_url or '' }}"></div>
    </div>

    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>
</div>
{% endblock %}
